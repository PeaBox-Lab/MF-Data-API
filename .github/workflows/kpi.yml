name: KPI Calculation

# KPI and analytics tables are recalculated inside update-data.yml. This
# workflow only triggers that pipeline so there is a single, chunked data job
# and no duplicate sync/export that could race or time out.

on:
  schedule:
    # 09:00 UTC (14:30 IST). update-data.yml also runs at 04:15 and 16:45 UTC.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force_full:
        description: "Backfill history in bounded windows"
        required: false
        default: false
        type: boolean
      bootstrap_days:
        description: "History depth for a fresh KPI dataset (days)"
        required: false
        default: "1095"
      window_days:
        description: "Days per backfill window (1-90)"
        required: false
        default: "90"
      max_windows:
        description: "Maximum pending backfill windows processed per run"
        required: false
        default: "4"

permissions:
  actions: write
  contents: read

concurrency:
  group: mf-data-pipeline-trigger
  cancel-in-progress: false

jobs:
  trigger-pipeline:
    name: Trigger chunked data pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOOTSTRAP_DAYS: ${{ github.event.inputs.bootstrap_days || '1095' }}
      FORCE_FULL: ${{ github.event.inputs.force_full == 'true' && 'true' || 'false' }}
      WINDOW_DAYS: ${{ github.event.inputs.window_days || '90' }}
      MAX_WINDOWS: ${{ github.event.inputs.max_windows || '4' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Dispatch update-data workflow
        run: |
          set -euo pipefail
          gh workflow run update-data.yml \
            --repo "${GITHUB_REPOSITORY}" \
            -f bootstrap_days="${BOOTSTRAP_DAYS}" \
            -f force_full="${FORCE_FULL}" \
            -f window_days="${WINDOW_DAYS}" \
            -f max_windows="${MAX_WINDOWS}"
          echo "Dispatched update-data.yml; KPI and analytics tables will be recalculated there."
